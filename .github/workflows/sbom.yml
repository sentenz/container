# SPDX-License-Identifier: Apache-2.0

name: SBOM

on:
  workflow_call:
    inputs:
      version:
        description: Release tag to generate and publish container SBOMs for
        required: true
        type: string
    secrets:
      GITHUB_TOKEN:
        required: true

permissions: {}

jobs:
  collect:
    name: Collect published image manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false

      - name: Download published image records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: published-image-*
          path: ${{ runner.temp }}/published-images
          merge-multiple: true

      - name: Validate published manifests and create matrix
        id: matrix
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          matrix="$(./scripts/sbom-matrix collect \
            --catalog containers/images.json \
            --owner "${OWNER}" \
            --version "${VERSION}" \
            "${RUNNER_TEMP}/published-images")"
          printf 'value=%s\n' "${matrix}" >> "${GITHUB_OUTPUT}"

  generate:
    name: Generate ${{ matrix.name }} ${{ matrix.platform }} SBOM
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.collect.outputs.matrix) }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SPDX SBOM
        uses: sentenz/actions/trivy@27b5bc872e2eb187ab306d29443bdf09683427a5 # 1.4.11
        with:
          scan-type: sbom-generate
          scan-target: ${{ matrix.image }}@${{ matrix.digest }}
          format: spdx-json
          output: ${{ matrix.filename }}
          exit-code: "0"

      - name: Generate CycloneDX SBOM
        uses: sentenz/actions/trivy@27b5bc872e2eb187ab306d29443bdf09683427a5 # 1.4.11
        with:
          scan-type: sbom-generate
          scan-target: ${{ matrix.image }}@${{ matrix.digest }}
          format: cyclonedx
          output: ${{ matrix.filename }}.cdx.json
          exit-code: "0"

      - name: Scan generated SPDX SBOM
        uses: sentenz/actions/trivy@27b5bc872e2eb187ab306d29443bdf09683427a5 # 1.4.11
        with:
          scan-type: sbom
          scan-target: ${{ matrix.filename }}
          format: table
          severity: HIGH,CRITICAL

      - name: Upload SBOM files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.filename }}
            ${{ matrix.filename }}.cdx.json
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest ${{ matrix.name }} ${{ matrix.platform }} SBOM
    needs: [collect, generate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.collect.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download SPDX SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}

      - name: Attest SPDX SBOM to image manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ matrix.digest }}
          sbom-path: ${{ matrix.filename }}
          push-to-registry: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish SBOMs to release
    needs: [collect, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false

      - name: Download SBOM files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: container-sbom-*
          path: sboms
          merge-multiple: true

      - name: Publish SBOMs to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.version }}
          files: sboms/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
