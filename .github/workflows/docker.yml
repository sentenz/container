# SPDX-License-Identifier: Apache-2.0

name: Container

on:
  pull_request:
    paths:
      - containers/**
      - scripts/container
      - scripts/sbom-matrix
      - tests/test_sbom_matrix.py
      - .dockerignore
      - Makefile
      - renovate.json
      - .github/workflows/docker.yml
      - .github/workflows/sbom.yml
  push:
    branches:
      - main
    paths:
      - containers/**
      - scripts/container
      - scripts/sbom-matrix
      - tests/test_sbom_matrix.py
      - .dockerignore
      - Makefile
      - renovate.json
      - .github/workflows/docker.yml
      - .github/workflows/sbom.yml
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:
    inputs:
      publish:
        description: Publish images to GHCR
        type: boolean
        default: false
      version:
        description: Release tag to check out and publish
        required: true
        type: string

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  catalog:
    name: Catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.event.release.tag_name }}
          persist-credentials: false

      - name: Validate catalog and create matrix
        id: matrix
        run: |
          matrix="$(./scripts/container matrix)"
          printf 'value=%s\n' "${matrix}" >> "${GITHUB_OUTPUT}"

      - name: Test SBOM manifest resolution
        run: python3 -m unittest discover -s tests -p 'test_sbom_matrix.py' -v

  security:
    name: Security
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.event.release.tag_name }}
          persist-credentials: false

      - name: Scan Containerfiles
        uses: sentenz/actions/trivy@27b5bc872e2eb187ab306d29443bdf09683427a5 # 1.4.11
        with:
          scan-type: config
          scan-target: containers
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1

  validate:
    name: Build ${{ matrix.name }}
    if: github.event_name != 'release' && !inputs.publish
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.event.release.tag_name }}
          persist-credentials: false

      - name: Build image
        uses: sentenz/actions/docker@27b5bc872e2eb187ab306d29443bdf09683427a5 # 1.4.11
        with:
          version: ci-${{ github.run_id }}-${{ github.run_attempt }}
          context: .
          file: ${{ matrix.file }}
          image-name: ${{ matrix.image_name }}
          platforms: ${{ matrix.platforms }}
          push: false

  publish:
    name: Publish ${{ matrix.name }}
    if: github.event_name == 'release' || inputs.publish
    needs:
      - catalog
      - security
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.event.release.tag_name }}
          persist-credentials: false

      - name: Build and publish image
        id: image
        uses: sentenz/actions/docker@27b5bc872e2eb187ab306d29443bdf09683427a5 # 1.4.11
        with:
          version: ${{ inputs.version || github.event.release.tag_name }}
          context: .
          file: ${{ matrix.file }}
          image-name: ${{ matrix.image_name }}
          platforms: ${{ matrix.platforms }}
          push: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record published platform manifests
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.image }}
          IMAGE_NAME: ${{ matrix.name }}
          PACKAGE: ${{ matrix.image_name }}
          PLATFORMS: ${{ matrix.platforms }}
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --raw > "${RUNNER_TEMP}/image-index.json"
          ./scripts/sbom-matrix record \
            --name "${IMAGE_NAME}" --image "${IMAGE}" --package "${PACKAGE}" --digest "${DIGEST}" \
            --platforms "${PLATFORMS}" --version "${VERSION}" \
            "${RUNNER_TEMP}/image-index.json" > "${RUNNER_TEMP}/published-image-${IMAGE_NAME}.json"

      - name: Upload published image record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-image-${{ matrix.name }}
          path: ${{ runner.temp }}/published-image-${{ matrix.name }}.json
          if-no-files-found: error
          # Preserve successful matrix records when only failed jobs are rerun.
          overwrite: true
          retention-days: 7

      - name: Report published image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.image }}
          TAGS: ${{ steps.image.outputs.tags }}
        run: |
          {
            echo "### Published ${IMAGE}"
            echo
            echo "- Digest: \`${DIGEST}\`"
            echo
            echo '```text'
            printf '%s\n' "${TAGS}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  sbom:
    name: Container SBOMs
    if: github.event_name == 'release' || inputs.publish
    needs: publish
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      actions: read
    uses: ./.github/workflows/sbom.yml
    with:
      version: ${{ inputs.version || github.event.release.tag_name }}
