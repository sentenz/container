name: Container

on:
  pull_request:
    paths:
      - containers/**
      - scripts/container
      - scripts/image-platform
      - tests/test_publication.py
      - .dockerignore
      - Makefile
      - renovate.jsonc
      - .github/workflows/docker.yml
      - .github/workflows/publish-image.yml
      - .github/workflows/sbom.yml
  push:
    branches:
      - main
    paths:
      - containers/**
      - scripts/container
      - scripts/image-platform
      - tests/test_publication.py
      - .dockerignore
      - Makefile
      - renovate.jsonc
      - .github/workflows/docker.yml
      - .github/workflows/publish-image.yml
      - .github/workflows/sbom.yml
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:
    inputs:
      publish:
        description: Publish images to GHCR
        type: boolean
        default: false
      version:
        description: Release tag to check out and publish
        required: true
        type: string

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  catalog:
    name: Catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.event.release.tag_name }}
          persist-credentials: false

      - name: Check registry naming and platform selection
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Validate catalog and create matrix
        id: matrix
        run: |
          matrix="$(./scripts/container matrix)"
          printf 'value=%s\n' "${matrix}" >> "${GITHUB_OUTPUT}"

  security:
    name: Security
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.event.release.tag_name }}
          persist-credentials: false

      - name: Scan Containerfiles
        uses: sentenz/actions/trivy@c600775dda21753455e72c46d37d32b452c35817 # 1.5.0
        with:
          scan-type: config
          scan-target: containers
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1

  validate:
    name: Build ${{ matrix.name }}
    if: github.event_name != 'release' && !inputs.publish
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.event.release.tag_name }}
          persist-credentials: false

      - name: Build image
        uses: sentenz/actions/docker@c600775dda21753455e72c46d37d32b452c35817 # 1.5.0
        with:
          version: ci-${{ github.run_id }}-${{ github.run_attempt }}
          context: .
          file: ${{ matrix.file }}
          image-name: ${{ matrix.name }}
          platforms: ${{ matrix.platforms }}
          push: false

  publish:
    name: Publish ${{ matrix.name }}
    if: github.event_name != 'pull_request' && (github.event_name == 'release' || inputs.publish)
    needs:
      - catalog
      - security
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    uses: ./.github/workflows/publish-image.yml
    with:
      name: ${{ matrix.name }}
      file: ${{ matrix.file }}
      platforms: ${{ toJSON(matrix.platform_list) }}
      version: ${{ inputs.version || github.event.release.tag_name }}
