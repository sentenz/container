# SPDX-License-Identifier: Apache-2.0

name: Container

on:
  pull_request:
    paths:
      - containers/**
      - scripts/container
      - .dockerignore
      - Makefile
      - renovate.json
      - .github/workflows/container.yml
  push:
    branches:
      - main
    paths:
      - containers/**
      - scripts/container
      - .dockerignore
      - Makefile
      - renovate.json
      - .github/workflows/container.yml
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  catalog:
    name: Catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate catalog and create matrix
        id: matrix
        run: |
          matrix="$(./scripts/container matrix)"
          printf 'value=%s\n' "${matrix}" >> "${GITHUB_OUTPUT}"

  security:
    name: Security
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan Containerfiles
        uses: sentenz/actions/trivy@ed8d725668082b21a56c2d043b6c7b32b5da1c63 # 1.4.5
        with:
          scan-type: config
          scan-target: containers
          format: table
          severity: HIGH,CRITICAL
          scanners: misconfig
          exit-code: 1

  validate:
    name: Build ${{ matrix.name }}
    if: github.event_name != 'release'
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        uses: sentenz/actions/docker@ed8d725668082b21a56c2d043b6c7b32b5da1c63 # 1.4.5
        with:
          version: ci-${{ github.run_id }}-${{ github.run_attempt }}
          context: .
          file: ${{ matrix.file }}
          image-name: ${{ matrix.name }}
          platforms: ${{ matrix.platforms }}
          push: false

  publish:
    name: Publish ${{ matrix.name }}
    if: github.event_name == 'release'
    needs:
      - catalog
      - security
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Build and publish image
        id: image
        uses: sentenz/actions/docker@ed8d725668082b21a56c2d043b6c7b32b5da1c63 # 1.4.5
        with:
          version: ${{ github.event.release.tag_name }}
          context: .
          file: ${{ matrix.file }}
          image-name: ${{ matrix.name }}
          platforms: ${{ matrix.platforms }}
          push: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report published image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.image }}
          TAGS: ${{ steps.image.outputs.tags }}
        run: |
          {
            echo "### Published ${IMAGE}"
            echo
            echo "- Digest: \`${DIGEST}\`"
            echo
            echo '```text'
            printf '%s\n' "${TAGS}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
